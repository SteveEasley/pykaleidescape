[project]
name = "pykaleidescape"
dynamic = ["version"]
description = "A python client library for the Kaleidescape System Control Protocol."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Steve Easley", email = "tardis74@yahoo.com" },
]
urls = { "Homepage" = "https://github.com/SteveEasley/pykaleidescape" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Dev tools are pinned to the versions Home Assistant uses; bump them together.
[dependency-groups]
dev = [
    "mypy==2.4.0",
    "prek==0.5.4",
    "pylint==4.1.2",
    "pytest-asyncio==1.4.0",
    "pytest-timeout==2.4.0",
    "pytest==9.0.3",
    "ruff==0.16.10",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kaleidescape"]

[tool.setuptools.package-data]
kaleidescape = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "kaleidescape._version.__version__" }

[tool.pytest.ini_options]
log_level = "DEBUG"
testpaths = "tests"
norecursedirs = ".git"
asyncio_default_fixture_loop_scope = "function"
timeout = 10
filterwarnings = [
    "ignore:.*loop argument is deprecated:DeprecationWarning"
]

[tool.ruff]
required-version = ">=0.16.10"
exclude = ["examples"]
lint.extend-select = ["ASYNC", "I"]

[tool.mypy]
disable_error_code = "annotation-unchecked"

[tool.pylint]
disable = [
    "duplicate-code",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-positional-arguments",
    "too-many-public-methods",
]
